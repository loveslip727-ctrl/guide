<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영종복합문화센터 길찾기</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .status {
      font-size: 15px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn-kakao {
      display: inline-block;
      width: 100%;
      padding: 16px 0;
      background-color: #FEE500;
      color: #191919;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      border-radius: 10px;
      box-sizing: border-box;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>영종복합문화센터 오시는 길</h2>
  <div id="status" class="status">내 위치를 확인하여<br>영종복합문화센터로 연결합니다...</div>
  
  <a id="mapLink" class="btn-kakao" href="#" style="display: none;">
    📍 영종복합문화센터 길찾기
  </a>
</div>

<script>
  // 100% 영종복합문화센터 목적지만 단독 설정
  const destName = encodeURIComponent("영종복합문화센터");
  const destLat = 37.4891;
  const destLng = 126.5592;

  const statusEl = document.getElementById("status");
  const mapLinkEl = document.getElementById("mapLink");

  // 캐시 방지를 위해 현재 시각(Timestamp) 파라미터 추가
  const cacheBuster = "&v=" + new Date().getTime();
  const fallbackUrl = `https://map.kakao.com/link/to/${destName},${destLat},${destLng}?${cacheBuster}`;

  function navigate() {
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const startLat = position.coords.latitude;
          const startLng = position.coords.longitude;
          const startName = encodeURIComponent("내위치");

          // 목적지: 영종복합문화센터
          const kakaoUrl = `https://map.kakao.com/link/destination/${destName},${destLat},${destLng}/sName/${startName}/sX/${startLng}/sY/${startLat}`;

          statusEl.innerHTML = "위치 확인 완료!<br>영종복합문화센터 경로로 연결합니다.";
          mapLinkEl.href = kakaoUrl;
          mapLinkEl.style.display = "inline-block";

          window.location.href = kakaoUrl;
        },
        (error) => {
          statusEl.innerHTML = "위치 확인 불가로<br>목적지 전용 화면으로 이동합니다.";
          mapLinkEl.href = fallbackUrl;
          mapLinkEl.style.display = "inline-block";
          window.location.href = fallbackUrl;
        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );
    } else {
      mapLinkEl.href = fallbackUrl;
      mapLinkEl.style.display = "inline-block";
      window.location.href = fallbackUrl;
    }
  }

  window.onload = navigate;
</script>

</body>
</html>
