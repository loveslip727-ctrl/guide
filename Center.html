<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영종복합문화센터 길찾기</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .status {
      font-size: 15px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn-kakao {
      display: inline-block;
      width: 100%;
      padding: 16px 0;
      background-color: #FEE500;
      color: #191919;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      border-radius: 10px;
      box-sizing: border-box;
      transition: background-color 0.2s;
    }
    .btn-kakao:hover {
      background-color: #e6ce00;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>영종복합문화센터 오시는 길</h2>
  <div id="status" class="status">현재 위치를 확인하는 중입니다...</div>
  <a id="mapLink" class="btn-kakao" href="#" target="_blank" style="display: none;">
    카카오맵 길찾기 시작
  </a>
</div>

<script>
  // 목적지: 영종복합문화센터 좌표 (위도, 경도)
  const destName = encodeURIComponent("영종복합문화센터");
  const destLat = 37.4891;
  const destLng = 126.5592;

  const statusEl = document.getElementById("status");
  const mapLinkEl = document.getElementById("mapLink");

  // 기본 목적지 단독 연결 URL (위치 권한 거부 시 대비)
  const defaultUrl = `https://map.kakao.com/link/to/${destName},${destLat},${destLng}`;

  function navigateToKakaoMap(url) {
    mapLinkEl.href = url;
    mapLinkEl.style.display = "block";
    // 페이지 로드 시 바로 길찾기 화면으로 자동 이동
    window.location.href = url;
  }

  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const startLat = position.coords.latitude;
        const startLng = position.coords.longitude;
        const startName = encodeURIComponent("내위치");

        // 출발지(내위치)와 목적지(영종복합문화센터)가 모두 들어간 카카오맵 URL
        const kakaoUrl = `https://map.kakao.com/link/destination/${destName},${destLat},${destLng}/sName/${startName}/sX/${startLng}/sY/${startLat}`;

        statusEl.innerHTML = "현재 위치가 확인되었습니다.<br>카카오맵으로 연결합니다.";
        navigateToKakaoMap(kakaoUrl);
      },
      (error) => {
        // 위치 권한 거부 또는 오류 시 목적지 기본 경로로 안내
        statusEl.innerHTML = "위치 정보를 가져올 수 없어<br>목적지 경로로 이동합니다.";
        navigateToKakaoMap(defaultUrl);
      },
      {
        enableHighAccuracy: true,
        timeout: 5000,
        maximumAge: 0
      }
    );
  } else {
    statusEl.innerHTML = "위치 서비스를 지원하지 않는 브라우저입니다.";
    navigateToKakaoMap(defaultUrl);
  }
</script>

</body>
</html>
