<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>길찾기 안내</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .status {
      font-size: 15px;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .btn-kakao {
      display: inline-block;
      width: 100%;
      padding: 16px 0;
      background-color: #FEE500;
      color: #191919;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      border-radius: 10px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>영종복합문화센터 길찾기</h2>
  <div id="status" class="status">위치 정보를 확인하고 있습니다...</div>
  <a id="mapLink" class="btn-kakao" href="#" target="_blank" style="display: none;">
    카카오맵으로 이동
  </a>
</div>

<script>
  // 목적지 정보
  const destName = encodeURIComponent("영종복합문화센터");
  const destLat = 37.4891;
  const destLng = 126.5592;

  const statusEl = document.getElementById("status");
  const mapLinkEl = document.getElementById("mapLink");

  // 위치 권한이 없거나 실패했을 때 사용할 기본 목적지 전용 링크
  const fallbackUrl = `https://map.kakao.com/link/to/${destName},${destLat},${destLng}`;

  // 이미 실행 중인지 확인하는 플래그 (중복 실행 방지)
  let isProcessing = false;

  function initLocation() {
    if (isProcessing) return;
    isProcessing = true;

    if ("geolocation" in navigator) {
      // getCurrentPosition은 단 1회만 위치를 조회합니다.
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const startLat = position.coords.latitude;
          const startLng = position.coords.longitude;
          const startName = encodeURIComponent("내위치");

          const kakaoUrl = `https://map.kakao.com/link/destination/${destName},${destLat},${destLng}/sName/${startName}/sX/${startLng}/sY/${startLat}`;

          statusEl.innerHTML = "위치 확인 완료!<br>카카오맵으로 연결합니다.";
          mapLinkEl.href = kakaoUrl;
          mapLinkEl.style.display = "inline-block";
          
          // 위치 확인 후 카카오맵으로 자동 이동
          window.location.href = kakaoUrl;
        },
        (error) => {
          // 위치 권한이 차단되었거나 실패한 경우
          statusEl.innerHTML = "위치 권한이 켜져있지 않아<br>목적지 경로로 안내합니다.";
          mapLinkEl.href = fallbackUrl;
          mapLinkEl.style.display = "inline-block";
        },
        {
          enableHighAccuracy: true,
          timeout: 7000,     // 7초 내 반응 없으면 실패 처리
          maximumAge: 60000   // 1분 내 캐시된 위치 정보 재활용하여 중복 요청 방지
        }
      );
    } else {
      statusEl.innerHTML = "위치 서비스를 지원하지 않는 브라우저입니다.";
      mapLinkEl.href = fallbackUrl;
      mapLinkEl.style.display = "inline-block";
    }
  }

  // 페이지 로드 시 단 1회만 호출
  window.addEventListener("DOMContentLoaded", initLocation);
</script>

</body>
</html>
