<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일자리 유형</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: auto;
      background: #0e1117;
      color: #ffffff;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    .app {
      display: grid;
      align-content: center;
      gap: clamp(14px, 2vw, 24px);
      width: min(96vw, 1500px);
      min-height: 100vh;
      padding: clamp(16px, 2vw, 28px) 0;
    }

    .box-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(12px, 2vw, 28px);
      height: min(56vh, 420px);
      padding: clamp(12px, 2vw, 28px);
    }

    .type-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border: 2px solid #2d3748;
      border-radius: 8px;
      background: #1a1f2e;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      color: #ffffff;
      cursor: pointer;
      font-family: inherit;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease, filter 0.15s ease;
    }

    .type-box:hover,
    .type-box.active {
      filter: brightness(1.18);
      transform: translateY(-4px);
    }

    .type-box:nth-child(1) {
      border-color: #3b82f6;
      background: #17243d;
    }

    .type-box:nth-child(2) {
      border-color: #22c55e;
      background: #142818;
    }

    .type-box:nth-child(3) {
      border-color: #f59e0b;
      background: #2b2111;
    }

    .type-box:nth-child(4) {
      border-color: #a855f7;
      background: #241438;
    }

    .label {
      width: 100%;
      color: #ffffff;
      font-size: clamp(44px, 7.4vw, 118px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      white-space: pre-line;
    }

    .description {
      display: none;
      margin: 0 clamp(12px, 2vw, 28px);
      padding: clamp(18px, 2.5vw, 32px);
      border: 2px solid #344155;
      border-radius: 8px;
      background: #151b28;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
    }

    .description.show {
      display: block;
    }

    .description-title {
      margin-bottom: 10px;
      color: #93c5fd;
      font-size: clamp(24px, 3vw, 46px);
      font-weight: 900;
      line-height: 1.1;
    }

    .description-text {
      color: #f8fafc;
      font-size: clamp(18px, 2vw, 30px);
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-line;
      word-break: keep-all;
    }

    .stop-button {
      display: none;
      width: max-content;
      margin: 0 clamp(12px, 2vw, 28px);
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      background: #ef4444;
      color: #ffffff;
      cursor: pointer;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
    }

    .stop-button.show {
      display: inline-flex;
    }

    @media (max-width: 900px) {
      .box-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        height: min(72vh, 620px);
      }

      .label {
        font-size: clamp(40px, 13vw, 94px);
      }
    }

    @media (max-width: 520px) {
      .box-row {
        grid-template-columns: 1fr;
        height: auto;
      }

      .type-box {
        min-height: 120px;
      }

      .label {
        font-size: clamp(38px, 16vw, 74px);
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="일자리 유형">
    <section class="box-row">
      <button class="type-box" type="button" data-type="public"><span class="label">공익
활동</span></button>
      <button class="type-box" type="button" data-type="capacity"><span class="label">역량
활용</span></button>
      <button class="type-box" type="button" data-type="community"><span class="label">공동체
사업</span></button>
      <button class="type-box" type="button" data-type="integrated"><span class="label">통합
안내</span></button>
    </section>

    <section class="description" id="description" aria-live="polite">
      <div class="description-title" id="description-title"></div>
      <div class="description-text" id="description-text"></div>
    </section>
    <button class="stop-button" id="stop-button" type="button">음성 중지</button>
  </main>

  <script>
    const descriptions = {
      public: {
        title: "공익형",
        text: `안녕하세요. 노인 공익형 일자리에 대해 안내해 드리겠습니다.

공익형은 만 65세 이상, 기초연금수급자이신 분이 신청하실 수 있습니다.

학교 안전 도우미, 공원 환경 정비 등 16가지 사업이 있으며, 주 2회에서 3회, 하루 3시간 활동하시고 매월 약 29만 원의 활동비가 지급됩니다.

단, 참여가 어려우신 경우도 있습니다. 생계급여 수급자이시거나, 건강보험 직장가입자이시거나, 현재 정부 및 지자체 일자리에 참여 중이시거나, 장기요양 1에서 5등급 또는 인지지원등급을 받으신 분은 신청이 제한됩니다.

준비 서류는 주민등록등본 1부와 본인 통장 사본입니다.
상담 시간은 평일 오전 9시부터 오후 6시까지이며, 토요일, 일요일, 공휴일은 휴무입니다.
저희 사무실은 운남동 쪽빛하늘로 21번지 운남우체국 3층에 위치해 있습니다.
감사합니다.`
      },
      capacity: {
        title: "역량형",
        text: `안녕하세요. 노인 역량형 일자리에 대해 안내해 드리겠습니다.

역량형은 만 65세 이상이신 분이 신청하실 수 있으며, 기초연금을 받지 않으시는 분도 지원이 가능합니다.

아동 돌봄, 경로당 급식, 공공기관 업무 보조 등 다양한 사업이 있으며, 주 5일, 하루 3시간 활동하시고 매월 최대 761,040원의 급여가 지급됩니다. 산재보험과 건강보험도 가입됩니다.

유관 자격증이 필요한 경우, 관련분야 국가자격(전문, 기술) 보유자만 신청하실 수 있으며 자격증 사본을 제출하셔야 합니다. 민간자격증은 인정하지 않습니다.

단, 참여가 어려우신 경우도 있습니다. 생계급여 수급자이시거나, 건강보험 직장가입자이시거나, 현재 정부 및 지자체 일자리에 참여 중이시거나, 장기요양 1에서 5등급 또는 인지지원등급을 받으신 분은 신청이 제한됩니다.

준비 서류는 주민등록등본 1부와 본인 통장 사본입니다.
상담 시간은 평일 오전 9시부터 오후 6시까지이며, 토요일, 일요일, 공휴일은 휴무입니다.
저희 사무실은 운남동 쪽빛하늘로 21번지 운남우체국 3층에 위치해 있습니다.
감사합니다.`
      },
      community: {
        title: "공동체형",
        text: `안녕하세요. 노인 공동체형 일자리에 대해 안내해 드리겠습니다.

공동체형은 만 60세 이상, 기초연금수급자 아니신 분도 신청하실 수 있습니다.

꽃 포장 작업장, 쌀과자 제조 및 판매, 실버카페 운영 등의 사업이 있으며, 쇼핑백 포장과 카페 운영은 시급 12,000원으로 월 6일에서 7일, 하루 5시간 활동하시고 월 360,000원에서 460,000원이 지급됩니다. 수익금도 추가로 받으실 수 있으며, 바리스타 자격증이 있으신 분은 카페 운영에서 우대됩니다.

단, 참여가 어려우신 경우도 있습니다. 생계급여 수급자이시거나, 건강보험 직장가입자이시거나, 현재 정부 및 지자체 일자리에 참여 중이시거나, 장기요양 1에서 5등급 또는 인지지원등급을 받으신 분은 신청이 제한됩니다.

준비 서류는 주민등록등본 1부와 본인 통장 사본입니다.
상담 시간은 평일 오전 9시부터 오후 6시까지이며, 토요일, 일요일, 공휴일은 휴무입니다.
저희 사무실은 운남동 쪽빛하늘로 21번지 운남우체국 3층에 위치해 있습니다.
감사합니다.`
      },
      integrated: {
        title: "통합형",
        text: `안녕하세요. 노인일자리 세 가지 유형에 대해 통합 안내해 드리겠습니다.

첫 번째, 공익형입니다.
만 65세 이상, 기초연금수급자이신 분이 신청하실 수 있습니다.
이팔청춘깜끔이, 학교 안전 도우미, 공원 환경 정비 등 16가지 사업이 있으며, 주 2회에서 3회, 하루 3시간 활동하시고 매월 약 29만 원의 활동비가 지급됩니다.

두 번째, 역량형입니다.
만 65세 이상이신 분이 신청하실 수 있으며, 기초연금을 받지 않으시는 분도 지원이 가능합니다.
아동 돌봄, 경로당 급식, 공공기관 업무 보조 등 다양한 사업이 있으며, 주 5일, 하루 3시간 활동하시고 매월 최대 761,040원의 급여가 지급됩니다. 산재보험과 건강보험도 가입됩니다. 유관 자격증이 필요한 경우 국가자격 보유자만 신청하실 수 있습니다.

세 번째, 공동체형입니다.
만 60세 이상, 기초연금을 받지 않으시는 분도 지원이 가능합니다.
꽃 포장 작업장, 쌀과자 제조 및 판매, 실버카페 운영 등의 사업이 있으며, 쇼핑백 포장과 카페 운영은 시급 12,000원으로 월 6일에서 7일, 하루 5시간 활동하시고 월 360,000원에서 460,000원이 지급됩니다. 바리스타 자격증이 있으신 분은 우대됩니다.

공통 안내 말씀드립니다.
생계급여 수급자이시거나, 건강보험 직장가입자이시거나, 현재 정부 및 지자체 일자리에 참여 중이시거나, 장기요양 1에서 5등급 또는 인지지원등급을 받으신 분은 신청이 제한됩니다.

준비 서류는 주민등록등본 1부와 본인 통장 사본입니다.
상담 시간은 평일 오전 9시부터 오후 6시까지이며, 토요일, 일요일, 공휴일은 휴무입니다.
저희 사무실은 운남동 쪽빛하늘로 21번지 운남우체국 3층에 위치해 있습니다.
감사합니다.`
      }
    };

    const description = document.getElementById("description");
    const descriptionTitle = document.getElementById("description-title");
    const descriptionText = document.getElementById("description-text");
    const stopButton = document.getElementById("stop-button");

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ko-KR";
      utterance.rate = 0.86;
      utterance.pitch = 1;
      utterance.onend = () => stopButton.classList.remove("show");
      window.speechSynthesis.speak(utterance);
      stopButton.classList.add("show");
    }

    document.querySelectorAll(".type-box").forEach((button) => {
      button.addEventListener("click", () => {
        const item = descriptions[button.dataset.type];
        document.querySelectorAll(".type-box").forEach((box) => box.classList.remove("active"));
        button.classList.add("active");
        descriptionTitle.textContent = item.title;
        descriptionText.textContent = item.text;
        description.classList.add("show");
        speak(item.text);
      });
    });

    stopButton.addEventListener("click", () => {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      stopButton.classList.remove("show");
    });
  </script>
</body>
</html>
